<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>SnapVideo client</title>
		<style>
			body {
				font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Arial,
					sans-serif;
				max-width: 760px;
				margin: 32px auto;
				padding: 0 16px;
			}
			.row {
				display: flex;
				gap: 8px;
			}
			input {
				flex: 1;
				padding: 12px;
				border: 1px solid #ccc;
				border-radius: 10px;
			}
			button {
				padding: 12px 14px;
				border: 0;
				border-radius: 10px;
				cursor: pointer;
				background: #007bff;
				color: white;
			}
			button:hover {
				background: #0056b3;
			}
			#result {
				margin-top: 16px;
				padding: 12px;
				border: 1px dashed #ccc;
				border-radius: 10px;
				min-height: 60px;
			}
			.small {
				opacity: 0.7;
				font-size: 0.9em;
				margin-top: 8px;
			}
			.error {
				color: #dc3545;
				border-color: #dc3545;
			}
			.success {
				color: #28a745;
				border-color: #28a745;
			}
			.loading {
				color: #007bff;
				border-color: #007bff;
			}

			.no-select {
				user-select: none;
				-webkit-user-select: none;
				-moz-user-select: none;
				-ms-user-select: none;
			}
		</style>
	</head>
	<body>
		<h1 class="no-select">SnapVideo</h1>

		<div class="row">
			<input
				id="url"
				type="text"
				placeholder="Dán văn bản hoặc link video vào đây…" />
			<button id="pasteBtn">Dán</button>
			<button id="goBtn">Lấy link</button>
		</div>
		<div class="small no-select">
			Youtube, TikTok, Facebook, Instagram, Twitter, Douyin, v.v.
		</div>

		<div class="no-select" id="result">Kết quả sẽ hiện ở đây.</div>

		<script>
			// --- Cấu hình ---
			// Dùng proxy serverless trên Vercel để tránh CORS
			const API = "/api/snapvideo";
			// Fallback API nếu API chính không hoạt động
			const FALLBACK_API = "https://snapvideo.io/api/info";

			// Cho phép những host này (cứ thêm bớt tùy bạn)
			const ALLOWED_HOSTS = new Set([
				"v.douyin.com",
				"www.douyin.com",
				"vt.tiktok.com",
				"www.tiktok.com",
				"youtu.be",
				"www.youtube.com",
				"m.youtube.com",
				"facebook.com",
				"www.facebook.com",
				"fb.watch",
				"twitter.com",
				"x.com",
				"www.x.com",
				"instagram.com",
				"www.instagram.com",
			]);

			// --- Tiện ích: trích URL đầu tiên hợp lệ từ một đoạn text ---
			function extractFirstURL(text) {
				if (!text) return null;
				// lấy tất cả chuỗi có dạng URL
				const matches = text.match(/https?:\/\/[^\s"'<>]+/g);
				if (!matches) return null;
				// chọn URL đầu tiên thuộc whitelist host
				for (const raw of matches) {
					try {
						const u = new URL(raw);
						// cắt ký tự kết dính (nếu có)
						let clean = raw.replace(/[)\]\.,;!?]+$/, "");
						const uu = new URL(clean);
						if (ALLOWED_HOSTS.has(uu.host)) return uu.toString();
					} catch (e) {
						/* bỏ qua item không hợp lệ */
					}
				}
				// nếu không có host whitelist, trả luôn cái đầu tiên
				return matches[0].replace(/[)\]\.,;!?]+$/, "");
			}

			// --- Gọi API & hiển thị ---
			async function getVideo(urlStr) {
				const result = document.getElementById("result");
				if (!urlStr) {
					result.textContent = "Chưa có URL hợp lệ.";
					result.className = "error";
					return;
				}

				result.textContent = "Đang lấy dữ liệu…";
				result.className = "loading";

				// Thử API chính trước
				try {
					const success = await tryAPI(API, urlStr, result);
					if (success) return;
				} catch (e) {
					console.log("Main API failed, trying fallback...");
				}

				// Nếu API chính thất bại, thử fallback
				try {
					result.textContent =
						"API chính không hoạt động, đang thử API dự phòng...";
					result.className = "loading";

					const success = await tryAPI(FALLBACK_API, urlStr, result);
					if (success) return;
				} catch (e) {
					console.error("Fallback API also failed:", e);
				}

				// Cả hai API đều thất bại
				result.textContent =
					"Cả hai API đều không hoạt động. Vui lòng thử lại sau hoặc liên hệ admin.";
				result.className = "error";
			}

			// Hàm thử gọi một API cụ thể
			async function tryAPI(apiUrl, urlStr, result) {
				const fullUrl = `${apiUrl}?url=${encodeURIComponent(urlStr)}&lang=vi`;
				console.log("Calling API:", fullUrl);

				const res = await fetch(fullUrl, {
					method: "GET",
					headers: {
						Accept: "application/json",
					},
				});

				if (!res.ok) {
					throw new Error(`HTTP error! status: ${res.status}`);
				}

				const contentType = res.headers.get("content-type");
				if (!contentType || !contentType.includes("application/json")) {
					console.warn("Response is not JSON:", contentType);
					// Try to parse as JSON anyway
				}

				const text = await res.text();
				console.log("Raw response:", text);

				// Check if response is HTML instead of JSON
				if (
					text.trim().startsWith("<!DOCTYPE") ||
					text.trim().startsWith("<html")
				) {
					console.error(
						"API returned HTML instead of JSON:",
						text.substring(0, 500)
					);
					return false; // Indicate failure
				}

				let data;
				try {
					data = JSON.parse(text);
				} catch (parseError) {
					console.error("Failed to parse JSON:", parseError);
					return false; // Indicate failure
				}

				// Xử lý dữ liệu từ API
				return processAPIResponse(data, result);
			}

			// Hàm xử lý phản hồi từ API
			function processAPIResponse(data, result) {
				// Tùy API, bạn có thể cần điều chỉnh các trường dưới đây:
				// thử gom các link tải phổ biến trong mảng
				const links = [];

				// 1) nếu trả về mảng "medias" hay "downloads"
				if (Array.isArray(data.medias)) {
					for (const m of data.medias) {
						if (m.url)
							links.push({
								label: m.quality || m.name || "Link",
								url: m.url,
							});
					}
				}
				if (Array.isArray(data.downloads)) {
					for (const d of data.downloads) {
						if (d.url)
							links.push({
								label: d.quality || d.type || "Link",
								url: d.url,
							});
					}
				}

				// 2) nếu trả về một trường đơn
				if (data?.video?.url)
					links.push({ label: "Video", url: data.video.url });
				if (data?.audio?.url)
					links.push({ label: "Audio", url: data.audio.url });
				if (data?.url) links.push({ label: "Tải", url: data.url });

				// 3) thử các trường khác có thể có
				if (data?.links && Array.isArray(data.links)) {
					for (const link of data.links) {
						if (link.url) {
							links.push({
								label: link.label || link.quality || "Link",
								url: link.url,
							});
						}
					}
				}

				if (links.length === 0) {
					result.textContent =
						"Không tìm thấy link tải trong phản hồi API. Dữ liệu API: " +
						JSON.stringify(data, null, 2);
					result.className = "error";
					console.log("API data:", data);
					return false; // Indicate failure
				}

				// render
				result.innerHTML = `
        <div class="success"><b>Tiêu đề:</b> ${
					data.title || "(không có)"
				} </div>
        <div><b>Links tải:</b></div>
        <ul>${links
					.map(
						(l) =>
							`<li><a href="${l.url}" target="_blank" rel="noopener">${l.label}</a></li>`
					)
					.join("")}</ul>
      `;
				result.className = "success";
				return true; // Indicate success
			}

			// --- Sự kiện: Nút "Dán & lọc link" ---
			document
				.getElementById("pasteBtn")
				.addEventListener("click", async () => {
					const input = document.getElementById("url");
					try {
						// iOS Safari sẽ hỏi quyền lần đầu
						const text = await navigator.clipboard.readText();
						const url = extractFirstURL(text);
						input.value = url || text || "";
						if (url) getVideo(url);
						else
							document.getElementById("result").textContent =
								"Không thấy URL trong clipboard.";
					} catch (e) {
						// fallback: nếu không có quyền clipboard
						document.getElementById("result").textContent =
							"Không đọc được clipboard. Hãy dán (Ctrl/Cmd+V) vào ô rồi bấm Lấy link.";
						input.focus();
					}
				});

			// --- Sự kiện: Khi bạn dán vào ô, tự lọc URL ---
			document.getElementById("url").addEventListener("paste", (ev) => {
				// đợi nội dung dán vào input rồi xử lý (microtask delay)
				setTimeout(() => {
					const input = ev.target;
					const url = extractFirstURL(input.value);
					if (url) {
						input.value = url;
						getVideo(url);
					}
				}, 0);
			});

			// --- Nút "Lấy link" (khi đã có URL trong ô) ---
			document.getElementById("goBtn").addEventListener("click", () => {
				const input = document.getElementById("url");
				const url = extractFirstURL(input.value) || input.value.trim();
				getVideo(url);
			});

			// --- Nếu bạn mở trang kèm text ở query (?q=…) cũng tự lọc luôn ---
			(function autoFromQuery() {
				const q = new URLSearchParams(location.search).get("q");
				if (!q) return;
				const input = document.getElementById("url");
				const url = extractFirstURL(q) || q;
				input.value = url;
				getVideo(url);
			})();
		</script>
	</body>
</html>
